apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-rag-config
  namespace: hr-rag
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "hr-rag-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "hr_rag_db"
  LLM_PROVIDER: "gemini"
  LLM_MODEL: "gemini-2.5-flash"
  EMBEDDING_PROVIDER: "gemini"
  EMBEDDING_MODEL: "gemini-embedding-001"
  EMBEDDING_DIMENSION: "1536"
  RERANKER_PROVIDER: "none"
  BGE_MODEL_NAME: "BAAI/bge-reranker-v2-m3"
  VECTOR_STORE: "postgres"
  DENSE_TOP_K: "30"
  SPARSE_TOP_K: "30"
  FUSION_TOP_K: "50"
  RERANK_TOP_K: "10"
  FINAL_CONTEXT_CHUNKS: "5"
  MAX_RETRIEVAL_RETRIES: "2"
  MAX_HISTORY_MESSAGES: "20"
  MAX_FILE_SIZE_MB: "50"
  UPLOAD_DIR: "/app/storage/uploads"
