apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hr-rag-postgres
  namespace: hr-rag
spec:
  serviceName: hr-rag-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hr-rag-postgres
  template:
    metadata:
      labels:
        app: hr-rag-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg15
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hr-rag-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-rag-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: hr-rag-config
                  key: POSTGRES_DB
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hr-rag-postgres
  namespace: hr-rag
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: hr-rag-postgres
